      <h1 style="margin:0 0 12px;font-size:1.5rem;color:#fff">Autopilot Studio — Cockpit IA pour produits numériques à 0 €</h1>
      <p><strong>Autopilot Studio</strong> est un tableau de bord local qui automatise la gestion d'un business de produits numériques (templates de budget sur Etsy) :</p>
      <ul>
        <li><strong>Opportunités</strong> : 11 idées produits notées automatiquement sur 100 (demande, concurrence, marge, viralité, risque, automatisation).</li>
        <li><strong>Content Studio</strong> : génération instantanée de packs prêts à publier — épingles Pinterest, scripts TikTok/Reels/Shorts, posts communautaires et annonces Etsy complètes.</li>
        <li><strong>Campagnes</strong> : suivi des visites, vues, clics, ventes, revenus et frais, avec décision automatique — CONTINUER, AMÉLIORER, ARRÊTER ou TESTER.</li>
        <li><strong>Réglages</strong> : nom de boutique, URL et devise, stockés localement dans un fichier JSON.</li>
      </ul>
      <p>Cette application fonctionne <strong>100 % en local</strong> (aucune donnée n'est envoyée en ligne), <strong>sans clé API</strong> et <strong>sans abonnement</strong>. Activez JavaScript pour l'utiliser, ou consultez le <a href="https://github.com/bayadimustapha42-art/autopilot" style="color:#7dd3fc">dépôt GitHub</a>.</p>
    </div>
